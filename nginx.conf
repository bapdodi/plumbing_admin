server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 업스트림 IP를 런타임에 재조회한다. 리터럴 호스트명은 nginx 기동 시점에 IP가 고정돼,
    # app 컨테이너를 재생성하면 죽은 옛 IP로 붙어 502가 된다 (2026-08-08 실제 장애).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app;

    location /api/ {
        proxy_pass http://$upstream_app:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 진입 파일은 캐시 금지 (파일명에 해시가 없어 스테일 배포를 유발함).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }

    # Vite 산출물은 파일명에 해시가 있어 장기 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — 라우트는 전부 index.html로 (vercel.json의 rewrite와 동일).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
